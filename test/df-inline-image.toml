body = '''
<p><a href="https://crazystupidtech.com/2026/06/27/how-an-argument-with-om-spawned-this-newsletter-rip-brother/" referrerpolicy="no-referrer" rel="noopener noreferrer" target="_blank">Fred Vogelstein</a> (Om’s partner at Crazy Stupid Tech):</p>

<blockquote>
  <p>We met a week later at his outdoor office — a bench in SF’s South
Park. He told me that he was going emeritus at True Ventures, the
VC firm, and that he was going to spend more of his time writing.</p>

<p>It was awesome to see him. Sitting on a bench with Om could be
quasi religious. He talked so softly and deliberately that it
forced you to slow down, lean in and forget about everything else.</p>

<p>What became clear was that we actually saw the world the same
way. We didn’t agree what Wired should be doing about it. But
we did agree on this: While everyone was fixated on big tech,
an explosion in tech innovation not seen in a generation was
taking place. We both agreed that not enough people were
writing about it.</p>

<p>“Maybe we should do something together then,” I said.</p>
</blockquote>

<p><a href="https://www.threads.com/@joannastern/post/DaBo4a2CeNE" referrerpolicy="no-referrer" rel="noopener noreferrer" target="_blank">Joanna Stern</a>:</p>

<blockquote>
  <p>So saddened to hear about <a href="https://www.threads.com/@om/" referrerpolicy="no-referrer" rel="noopener noreferrer" target="_blank">@om</a>. His writing was one of the
reasons I went into tech journalism. Right out of college, I was
working at a PR agency and started reading his site. It inspired
me to start blogging.</p>

<p>Years later, he tried to recruit me. Even after I went elsewhere,
he’d send me notes telling me how proud he was of my work. He’d
often review my reviews, so here’s mine of him: Generous with his
time. Honest with his feedback. Endlessly encouraging to those
coming up behind him.</p>
</blockquote>

<p><a href="https://www.threads.com/@crumbler/post/DaBhc8XjImx" referrerpolicy="no-referrer" rel="noopener noreferrer" target="_blank">Casey Newton</a>:</p>

<blockquote>
  <p>Very sad to hear about the passing of <a href="https://www.threads.com/@om/" referrerpolicy="no-referrer" rel="noopener noreferrer" target="_blank">@om</a>. He shared two lasting
lessons with me: the first when I was a cub tech reporter at the
