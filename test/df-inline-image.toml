</blockquote>

<p><a href="https://blog.jim-nielsen.com/2026/tribute-to-om/" referrerpolicy="no-referrer" rel="noopener noreferrer" target="_blank">Jim Nielsen</a>:</p>

<blockquote>
  <p>One day on Twitter I got a DM from someone with the handle @om.</p>

<p>“I don’t know who this is,” I thought, “but damn that is a great
handle!”</p>

<p>Then I peaked at the follower count: over 1 million!</p>

<p>“WTF? Who is this???” I thought.</p>

<p>I’d never — then or since — been contacted by someone with such
a high profile online.</p>

<p>How was I even on this person’s radar?</p>
</blockquote>

<p>Om seemingly read <em>everything</em>.</p>

<p><a href="https://www.linkedin.com/pulse/how-om-malik-finally-got-his-big-break-jason-hiner-7d3fc/" referrerpolicy="no-referrer" rel="noopener noreferrer" target="_blank">Jason Hiner, in a post on LinkedIn</a>:</p>

<blockquote>
  <p><em>This is the opening anecdote from “Chapter Six: The Blogger” from
my 2016 book,</em> Follow the Geeks<em>, co-authored with Lyndsey Gilpin.
Om once told me that “For three years, it was every day a
rejection” as he tried to break into tech journalism. This was how
he finally broke through.</em></p>

<p>David Churbuck checked his voicemail. There was a message from
someone looking for a job.</p>

<p>Because of the guy’s thick Indian accent, David could barely make
out what he was saying, except that he worked for a wire service
down on Wall Street and was a big Forbes fan. The guy heard that
Forbes was going to be one of the first media companies to launch
its magazine on the web and he wanted to come help.</p>

<p>David ignored the message. He had a small team and hardly
any budget.</p>

<p>Then he got a fax. It was from this guy, explaining why he was a
perfect fit to join the team.</p>

<p>The next day, the guy left another message. If David would just
give him a call, it would be great to talk with him. He wouldn’t
regret it.</p>

<p>Ignore.</p>

<p>The following day, he left another. Whatever time limit there was
for voicemails, this guy always used up every minute.</p>

<p>Still, David ignored it.</p>

<p>And then the guy started getting creative.</p>

<p>[...]</p>

<p>One of the journalists, Michael Noer, said half jokingly, “Just
call the guy in!” So, partly out of admiration, and partly out of
pure morbid curiosity, David called him back.</p>

<p>One interview. Fifteen minutes. That was all it took for David to
hire Om Malik.</p>
</blockquote>

<p>“They do not sell themselves”, <a href="https://daringfireball.net/2026/06/om" referrerpolicy="no-referrer" rel="noopener noreferrer" target="_blank">Om told me</a> in a separate story from that same time in his life.</p>

<p>Hiner made <a href="https://static1.squarespace.com/static/5793d5d7725e254c7c7faefd/t/6a4060f2f60bc831ed1a981e/1782604018112/om-malik-chapter-6-follow-the-geeks.pdf" referrerpolicy="no-referrer" rel="noopener noreferrer" target="_blank">the entire chapter available to read as a handsome PDF</a>. It’s so good, and so utterly Om. It’s a crackerjack good read about the very early “WWW” days of the web. A bit:</p>

<blockquote>
  <p>Om is charming and disarming, forceful and accommodating. He has
an easy smile, a quiet, melodic voice, and a handsome face. Once
he opens his mouth, it’s obvious how much he reads and how thirsty
he is to learn. It’s rare to meet someone who is ready to debate
you on almost any topic, but who’s also genuinely curious about
your life and your opinion. It all makes the burly journalist one
of the most huggable people on Earth. That’s what David was up
against when he met Om. He didn’t stand a chance.</p>

<p>“It was destiny,” said David, with a self-deprecating laugh. “It
was total destiny.”</p>
</blockquote>

<p>Om’s close friend, photographer Christopher Michel, published “<a href="https://www.christophermichel.com/People/Om-the-Great/n-WkMDW" referrerpolicy="no-referrer" rel="noopener noreferrer" target="_blank">Om the Great</a>”, an enormous gallery of portraits of him. Here’s just one of hundreds:</p>

<p><a href="https://daringfireball.net/misc/2026/06/michel-om-malike-2024.jpeg" referrerpolicy="no-referrer" rel="noopener noreferrer" target="_blank">
  <img src="https://daringfireball.net/misc/2026/06/michel-om-malike-2024.jpeg" alt="July 2024 portrait of Om Malik, holding a camera, by Christopher Michel." loading="lazy"/></a></p>

<p>Lastly, here’s a story from Andrew Sasaki, which he sent me by email, and I’m reproducing with his permission. It’s the perfect Om story:</p>

<blockquote>
  <p>I met Om briefly at a tech event in NYC around 2008 or so. He was
talking with a friend of mine, and when I walked up he introduced
himself: “Hi, I’m Om.”</p>

<p>“‘Om’ like ‘Om Malik’?” I asked.</p>

<p>This amused him greatly.</p>

<p>“Yes, exactly like Om Malik”, he said.</p>

<p>A couple of years later the iPad had just launched, and I saw my
friend again at another industry event. I asked him a question
related to the unprecedented development effort we were already
seeing around the new platform that didn’t yet have a single
compelling use case.</p>

<p>“You know who I bet would know about that? Om Malik”, he said, and
gave me Om’s email address.</p>

<p>I hesitated to bother Om, but eventually reached out with my
question. “I don’t know if you remember me, but we met a couple of
years ago, and…” blah blah blah.</p>

<p>Naturally, there was no answer. Why would there be? He doesn’t
know me from Adam, and he’s Om Fucking Malik.</p>

<p>Except there <em>was</em> an answer about 4 days later. Om started off by
apologizing for the delay in responding, but he had taken the time
to research his answer before writing to me. And of course, his
answer was thoughtful, insightful, and absolutely correct. I was
gobsmacked at the generosity he had shown replying to someone he
didn’t even know. He gave no indication that he even remembered me
until his signature line:</p>

<p>“Exactly Like Om Malik”</p>
</blockquote>'''
