name: Publish preview pages

on:
  workflow_run:
    workflows: [Theme checks]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  source:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    outputs:
      workflow: ${{ steps.source.outputs.workflow }}
    steps:
      # Deploy only when Pages builds from GitHub Actions: a repository that serves
      # its own site from a branch keeps it, and the gallery stays a check artifact.
      # A separate job, so a skipped deploy leaves no github-pages deployment behind.
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || true)
          if [ "$build_type" = workflow ]; then
            echo "workflow=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$build_type" ]; then
            echo "Pages builds from a branch here, so the gallery is not published." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Pages is off. To publish the gallery, set Settings → Pages → Source to GitHub Actions." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
  deploy:
    needs: source
    if: needs.source.outputs.workflow == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    steps:
      # Reuses the gallery the passing check rendered; no second render gate.
      - name: Download the checked preview gallery
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: theme-preview-${{ github.event.workflow_run.head_sha }}
          path: build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/preview
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
