name: Set up theme tooling
description: Install the locked Python environment, the pinned Playwright CLI, and WebKit.

inputs:
  webkit-deps:
    description: Install WebKit's Linux runtime dependencies. Use false on macOS.
    default: "true"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10
      with:
        enable-cache: true
    - name: Install locked Python environment
      shell: bash
      run: uv sync --locked
    - name: Install pinned Playwright CLI and WebKit
      shell: bash
      env:
        WEBKIT_DEPS: ${{ inputs.webkit-deps }}
      run: |
        npm install --global @playwright/cli@0.1.20
        if [ "$WEBKIT_DEPS" = "true" ]; then
          playwright-cli install-browser webkit --with-deps
        else
          playwright-cli install-browser webkit
        fi
