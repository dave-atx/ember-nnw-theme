        </figure>
<p>Polybius was a rumoured rare or secret 1981 arcade game published by Sinneslöschen that was addictive and had adverse effects on its players, causing hallucinations, amnesia, and seizures.</p>
<p>In contrast with <a href="https://unsung.aresluna.org/players-are-still-trying-to-find-the-alternate-reality-that-might-be-hidden-underneath/">some of the August 32 videos</a> which sport a certain “we know the authors denied this, <em>but</em>” posture, this video doesn’t waste time pretending Polybius is anything more than an urban legend. Instead, it goes straight to investigating what happened and who might have started the rumour. </p>
<p>It’s a really fun watch – and a really well-made mini-documentary, too – and ends up being a meditation on mythmaking in general.</p><a href="https://unsung.aresluna.org/tags/games/">#games</a> <a href="https://unsung.aresluna.org/tags/halloween/">#halloween</a> <a href="https://unsung.aresluna.org/tags/history/">#history</a> <a href="https://unsung.aresluna.org/tags/youtube/">#youtube</a>
