          <source media="(resolution >= 2x) and (width >= 700px)" srcset="https://unsung.aresluna.org/_media/an-unnamed-arcade-in-some-sleepy-suburb-of-portland/yt1-play.2096w.avif" type="image/avif">
          <source media="(resolution >= 3x) or (width >= 700px)" srcset="https://unsung.aresluna.org/_media/an-unnamed-arcade-in-some-sleepy-suburb-of-portland/yt1-play.1600w.avif" type="image/avif">
