title = 'Introducing Personal Finance in Claude'
body = '''
<p>Getting answers about your money no longer means opening every banking app and doing the math yourself. With Personal Finance in Claude, you can securely connect your bank and card accounts and ask in your own words. Access is read-only, and Personal Finance can’t move, manage, or invest your money.</p><figure><img alt="" decoding="async" height="1782" src="https://assets.claude.com/b87507b2ca680b626804a95946d15f34391e07f7.png" width="3168" loading="lazy"/></figure><p>Claude gives you answers in everyday language, from your balances and transactions, and explains any term that&#39;s new to you. Like <a href="https://www.anthropic.com/news/claude-is-a-space-to-think" referrerpolicy="no-referrer" rel="noopener noreferrer" target="_blank">the rest of Claude</a>, Personal Finance has no ads or sponsored recommendations, and it doesn’t offer credit cards, loans, or savings accounts of its own, so your money questions get a straight answer.</p><p>Personal Finance starts rolling out in beta this week, on the Pro, Max, and Ultra plans in the US.</p><h2 id="what-it-looks-like"><strong>What it looks like</strong></h2><p>Say it&#39;s late in the month and payday is still 10 days away. When you ask Claude, &#34;Where did my money go this month?&#34; it adds up your spending across the accounts you connected and sorts it by category. In this example, that comes to $4,309.37, with more than half going to rent and utilities and $1,024.51 to food and drink.</p><figure><img alt="" decoding="async" height="467" src="https://assets.claude.com/bc5343b7f36d1704f728e53c69f672ae05c576e1.png" width="776" loading="lazy"/></figure><p>From there, you can dig deeper: &#34;Is that more than usual?&#34; &#34;Anything else I&#39;m missing?&#34; &#34;So what&#39;s left before payday?&#34; Claude checks the previous months and points to a membership renewal. Then Claude tells you about four payments that will come out of your checking account before payday, and what you’ll have left: $1,393.22.</p><figure><img alt="" decoding="async" height="647" src="https://assets.claude.com/734b3f5688057d9a672bf9f32aa4c450c8732e8d.png" width="844" loading="lazy"/></figure><p>If you ask whether anything looks off, Claude reads across every account you&#39;ve connected and can point to what&#39;s easy to miss, like charges that hit twice, unexpected fees, or a bill that’s crept up all year. You can also ask bigger questions, like &#34;Am I spending more than I make?&#34; or &#34;What&#39;s an APR, and what has mine cost me this year?&#34; Claude explains the term, then adds up the interest you&#39;ve been charged.</p><p>Ask for a weekly spending chart, a calendar of what&#39;s due, or a dashboard of the numbers you choose, and Claude builds one you can keep adjusting.</p><h2 id="security-and-privacy"><strong>Security and privacy</strong></h2><p>Claude&#39;s access is read-only. Personal Finance helps you understand your money, and it isn&#39;t designed to give investment advice. Claude can make mistakes in its answers, so ask which transactions are behind a number, and check important figures with your bank.</p><p>Your accounts are only connected once you sign in to your bank yourself through <a href="https://plaid.com/" referrerpolicy="no-referrer" rel="noopener noreferrer" target="_blank">Plaid</a>, a service that connects apps to banks. That&#39;s where you agree to its terms and approve Claude&#39;s read-only access, so Claude doesn&#39;t ask for or see your bank password.</p><p>For the accounts you choose to connect (and only those), Claude sees the bank&#39;s name, each account&#39;s name, type, and last four digits, balances and credit limits, and up to two years of transactions. When you chat with Claude in the Personal Finance hub, those conversations aren&#39;t used to train our models. For anything you share with Claude outside the hub, your <a href="https://claude.ai/settings/privacy" referrerpolicy="no-referrer" rel="noopener noreferrer" target="_blank">privacy settings </a>apply. You can unlink an account anytime, and then Claude can no longer see its data. More details can be found in our <a href="https://privacy.claude.com/en/collections/10663362-consumers" referrerpolicy="no-referrer" rel="noopener noreferrer" target="_blank">Privacy Center.</a></p><h2 id="getting-started"><strong>Getting started</strong></h2><p>When you see Personal Finance in Claude&#39;s sidebar, open it, connect one account, and ask a single question, like &#34;Can I afford a trip this spring?&#34; or &#34;How much could I save each month?&#34; You&#39;ll find the setup steps, and how your data is used and kept, in the <a href="https://support.claude.com/en/articles/18185620-use-personal-finance-with-claude" referrerpolicy="no-referrer" rel="noopener noreferrer" target="_blank">Help Center. (opens in new tab)</a></p><h2 id="what-s-next"><strong>What’s next</strong></h2><p>Personal Finance is a first step. For life’s bigger money decisions, we think people are best served by Claude working alongside the licensed professionals and regulated firms they trust. We’re exploring how to make that possible in Claude, and we’d like to hear from banks, wealth managers, and financial services companies who want to help shape it.</p>
