<p>External fire escapes are becoming a thing of the past<br>
📰 Go to <a href="https://ground.news/practicalengineering">https://ground.news/practicalengineering</a> to get 40% off unlimited access to the news tool I use. It helps you cut through the noise and understand how stories are being reported across the spectrum.</p>
<p>Writing building regulations is a messy process, and there really is rarely a single “right” answer. There are just tradeoffs that affect every building differently and ripple through space, time, and the economy.</p>
<p>📖My new book, Disasters By Design: How Engineering Failures Shaped the Modern World is coming March 2, 2027 and available for preorder now.<br>
