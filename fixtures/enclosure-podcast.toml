# A podcast episode as NetNewsWire renders it with enclosure support: show notes in
# the body, an untitled audio <enclosure> (so the caption falls back to the file
# name), and the episode's itunes:image, which NetNewsWire shows as an enclosure
# because nothing else is visual. Ember lifts both above the body: the artwork as
# lead art, capped in height because it's square, then the audio card. Modeled on
# ATP 311, the case in NetNewsWire's EnclosuresHTMLTests; replace with a capture.
# Preview with: npx nnw-theme@2 render enclosure-podcast

