body = '''
<p>Every year I write a list of small annoyances, and every year most of them survive the next release. This time one of them didn’t, and I want to give credit where it’s due before I forget what it was like.</p>
<p>The fix is not dramatic. Windows that used to forget their size after a restart now remember it, and the setting that controlled this, which nobody could find, is gone because it no longer needs to exist.</p>
<p>That’s the best kind of fix: the one that removes a preference instead of adding one.</p>
