<p>On this day <a href="https://coreint.org/2008/05/episode-1-two-voices/">16 years ago</a>, Daniel and I released the first episode of Core Intuition. So many things have changed since then. Listening to episode 1 is like going back in a time machine, to weeks before WWDC, on the verge of the App Store launching, a snapshot of the Mac developer community. 🎂</p>
