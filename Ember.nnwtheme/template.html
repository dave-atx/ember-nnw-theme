<!-- Template Variables

title: The title of the article
preferred_link: The best link to associate with the article for linking out.

external_link_label: A localized label for the external link.
external_link_stripped: The external link minus the scheme. Useful for displaying the external link.
external_link: The external link of the article if there is one provided by the author.

feed_link_title: The name of the feed associated with this article.
feed_link: The URL of the feed associated with this article.
byline: HTML that combines all the authors and links to them if available.
avatar_src: The image source URL for the feed icon / avatar.
dateline_style: Either "articleDateline" or "articleDatelineTitle" depending on if the title was populated or not.

datetime_long: Long version of a combined publish date and time.
datetime_medium: Medium length version of a combined publish date and time.
datetime_short: Short version of a combined publish date and time.

date_long: Long version of the publish date.
date_medium: Medium version of the publish date.
date_short: Long version of the publish date.

time_long: Long version of the publish time.
time_medium: Medium version of the publish time.
time_short: Long version of the publish time.

text_size_class: The size class that the user has selected in Preferences for article text.
body: The body of the article.
enclosures: Audio and video players and images from the article's enclosures.

-->

<header class="headerContainer">
	<table cellpadding=0 cellspacing=0 border=0 class="headerTable">
	<tr>
		<td class="header leftAlign"><a class="feedlink" href="[[feed_link]]">[[feed_link_title]]</a><br />[[byline]]</td>
		<td class="header rightAlign avatar"><img id="nnwImageIcon" src="[[avatar_src]]" alt="" height=48 width=48 /></td>
	</tr>
	</table>
</header>

<article>
<div class="articleTitle"><h1><a href="[[preferred_link]]">[[title]]</a></h1></div>
<div class="[[dateline_style]]"><a href="[[preferred_link]]">[[datetime_medium]]</a></div>
<div class="externalLink">[[external_link_label]] <a href="[[external_link]]">[[external_link_stripped]]</a></div>
<div id="bodyContainer" class="articleBody [[text_size_class]]">[[body]]</div>
<div class="ember-enclosures [[text_size_class]]">[[enclosures]]</div>
</article>

<!--
	Enclosure adapter. NetNewsWire writes every enclosure into one block after the
	body. Lift what leads the article above it: audio and video players, and a lone
	image, which is the article's own image when nothing else is visual (a podcast
	episode's artwork). More than one image stays below, as a gallery. Then split an
	audio caption, "Title · 1:54:09 · 54.9 MB", into the card's title and its
	duration and size. With Article JavaScript off, everything stays below the body.
	A NetNewsWire too old for enclosures leaves the macro as text; CSS hides the
	wrapper whenever it holds no .nnw-enclosures.
-->
<script>
(() => {
	const below = document.querySelector(".ember-enclosures > .nnw-enclosures");
	const body = document.querySelector(".articleBody");
	if (!below || !body) return;
	const all = [...below.children];
	const images = all.filter(item => item.matches(".nnw-enclosure-image"));
	const leading = all.filter(item => item.matches(".nnw-enclosure-audio, .nnw-enclosure-video") ||
		(images.length === 1 && item === images[0] &&
			!all.some(other => other.matches(".nnw-enclosure-video"))));
	if (leading.length) {
		const lead = document.createElement("div");
		lead.className = `${below.parentElement.className} ember-enclosures-lead`;
		const list = lead.appendChild(document.createElement("div"));
		list.className = "nnw-enclosures";
		list.append(...leading);
		body.before(lead);
		if (!below.children.length) below.remove();
	}

	const duration = /^\d+:\d\d(:\d\d)?$/;
	const size = /^(Zero KB|[\d.,\u00a0\u202f]+\s?\p{L}{1,5})$/u;
	for (const caption of document.querySelectorAll(".nnw-enclosure-audio > .nnw-enclosure-caption")) {
		const parts = caption.textContent.split(" · ");
		const meta = [];
		while (parts.length > 1 && (duration.test(parts.at(-1)) || size.test(parts.at(-1)))) {
			meta.unshift(parts.pop());
		}
		const title = document.createElement("span");
		title.className = "ember-enclosure-title";
		title.textContent = parts.join(" · ");
		caption.replaceChildren(title);
		if (meta.length) {
			const details = caption.appendChild(document.createElement("span"));
			details.className = "ember-enclosure-meta";
			details.textContent = meta.join(" · ");
		}
	}
})();
</script>

<!--
	Caption adapter. Ars Technica's feed reaches NetNewsWire in two broken shapes:
	a bare image followed by loose caption text, which CSS cannot select, and a
	figure that repeats its figcaption as loose text. Wrap the first in
	p.ember-caption and drop the repeat, and mark MacStories's caption once
	Miniflux strips its class; then set any trailing "Credit: …" or "Source: …" apart
	as span.ember-credit. Floated images are skipped: text beside them is copy.
-->
<script>
(() => {
	const article = document.querySelector(".articleBody");
	if (!article) return;
	const squash = text => text.replace(/\s+/g, " ").trim();
	const blocks = /^(P|H[1-6]|IMG|FIGURE|BLOCKQUOTE|UL|OL|PRE|TABLE|HR|DIV)$/;

	for (const img of article.querySelectorAll(":scope > img:not([style*='float'], [align])")) {
		const texts = [];
		let node = img.nextSibling;
		while (node && node.nodeType === Node.TEXT_NODE) {
			texts.push(node);
			node = node.nextSibling;
		}
		if (node && !blocks.test(node.nodeName)) continue;
		const text = squash(texts.map(t => t.textContent).join(" "));
		if (!text || text.length > 600) continue;
		const caption = document.createElement("p");
		caption.className = "ember-caption";
		caption.textContent = text;
		for (const t of texts) t.remove();
		img.after(caption);
	}

	// Miniflux strips MacStories's p.image-caption to a bare paragraph after
	// the image; an empty one stays as it is.
	for (const caption of article.querySelectorAll(":scope > img[src*='cdn.macstories.net/'] + p")) {
		if (caption.textContent.trim()) caption.classList.add("ember-caption");
	}

	for (const caption of article.querySelectorAll("figure > figcaption")) {
		const loose = [...caption.parentNode.childNodes].filter(n => n.nodeType === Node.TEXT_NODE);
		const text = squash(loose.map(t => t.textContent).join(""));
		if (text && text.replace(/\s/g, "") === caption.textContent.replace(/\s/g, "")) {
			for (const t of loose) t.remove();
		}
	}

	for (const caption of article.querySelectorAll("figcaption, .ember-caption, .wp-caption-text, .image-caption")) {
		// The credit runs from its label to the caption's end, links included.
		const label = /\b(?:Credit|Source):/;
		const start = [...caption.childNodes].find(n => n.nodeType === Node.TEXT_NODE && label.test(n.textContent));
		if (!start) continue;
		const rest = start.splitText(start.textContent.search(label));
		const credit = document.createElement("span");
		credit.className = "ember-credit";
		rest.before(credit);
		while (credit.nextSibling) credit.append(credit.nextSibling);
	}
})();
</script>

<!--
	NetNewsWire themes cannot bundle a separate JavaScript file. This inline adapter
	normalizes common footnote markup to the .footnote + local-target convention
	understood by NetNewsWire's built-in newsfoot popover script.
-->
<script>
(() => {
	const article = document.querySelector(".articleBody");
	if (!article) return;

	const backlinkSelector = ".reversefootnote, .footnoteBackLink, .footnote-return, .footnote-backref, .footnote-back, .footnote-back-link, .easy-footnote-to-top, .modern-footnotes-scroll-to-footnote, .footnote_plugin_index a, [role='doc-backlink'], [data-footnote-backref]";
	// Markup that names itself a footnote reference. Such a link is trusted on its
	// own; the looser shape-based guesses below additionally require a plausible note.
	const semanticReferenceSelector = ".footnote, .footnote-ref, .footnoteRef, [role='doc-noteref'], [data-footnote-ref]";
	// Descendants of a reference that a return link might legitimately target.
	const innerLandmarkSelector = "sup[id], [id^='fn'], [id^='footnote'], [id^='identifier_'], [id^='easy-footnote-']";
	const normalizedNotes = document.createElement("div");
	normalizedNotes.hidden = true;
	normalizedNotes.dataset.emberFootnotes = "";
	const backlinkDestinations = new Map();
	let referenceNumber = 0;
	let noteNumber = 0;

	let baseUrl;
	try {
		baseUrl = new URL(document.baseURI);
	} catch (_) {
		baseUrl = null;
	}

	function localHashId(link) {
		const href = link.getAttribute("href");
		if (!href?.includes("#") || !baseUrl) return;
		try {
			const url = new URL(href, baseUrl);
			if (url.origin !== baseUrl.origin || !url.hash) return;
			if ((url.pathname !== baseUrl.pathname || url.search !== baseUrl.search) && (url.pathname !== "/" || url.search)) return;
			return decodeURIComponent(url.hash.slice(1));
		} catch (_) {
			return;
		}
	}

	function isBacklink(link) {
		return link.matches(backlinkSelector);
	}

	function looksLikeReference(link) {
		return link.matches(`${semanticReferenceSelector}, .jetpack-footnote, .footnote-identifier-link, [id^='footnote-anchor-']`) ||
			link.matches("sup > a, sup > div > a, .easy-footnote > a, .footnote_referrer > a") ||
			!!link.querySelector(":scope > sup");
	}

	function looksLikeNote(target) {
		if (/^(fnref|user-content-fnref-|identifier_|footnote-anchor-)/.test(target.id)) return false;
		return target.matches("[role='doc-endnote'], [id^='fn'], [id^='footnote'], [id^='easy-footnote-bottom-']") ||
			!!target.closest(".footnotes, [data-footnotes], .wp-block-footnotes, .easy-footnotes-wrapper, .footnote-reference-container");
	}

	function noteContainer(target) {
		if (target.matches(".easy-footnote-margin-adjust")) return target.closest("li") || target;
		if (target.closest(".footnote-reference-container")) return target.closest("tr")?.querySelector("td.footnote_plugin_text") || target;
		return target;
	}

	function substackNote(target) {
		const wrapper = document.createElement("div");
		for (let node = target.nextSibling; node; node = node.nextSibling) {
			if (node instanceof HTMLAnchorElement && node.matches("a[id^='footnote-']")) break;
			wrapper.appendChild(node.cloneNode(true));
		}
		return wrapper;
	}

	function noteFor(reference) {
		const modern = reference.closest(".modern-footnotes-footnote");
		if (modern) {
			const id = reference.getAttribute("aria-describedby");
			const target = id && document.getElementById(id);
			if (target) return {content: target, hide: target};
		}

		const referrer = reference.closest(".footnote_referrer");
		if (referrer?.querySelector(":scope > a") === reference) {
			const marker = referrer.querySelector(".footnote_plugin_tooltip_text[id]");
			const tooltip = referrer.querySelector(".footnote_tooltip[id]");
			const targetId = marker?.id.replace("footnote_plugin_tooltip_", "footnote_plugin_reference_");
			const target = targetId && document.getElementById(targetId);
			const content = target ? noteContainer(target) : tooltip;
			if (content) return {content, hide: tooltip};
		}

		if (!looksLikeReference(reference)) return;
		const targetId = localHashId(reference);
		const target = targetId && document.getElementById(targetId);
		if (!target || target.contains(reference)) return;
		const explicitlySemantic = reference.matches(semanticReferenceSelector);
		if (!looksLikeNote(target) && !explicitlySemantic) return;
		return {content: reference.matches("a[id^='footnote-anchor-']") ? substackNote(target) : noteContainer(target)};
	}

	// Providers disagree about the marker itself: some bake the brackets into the
	// text ("[7]"), some leave a space before the reference and some don't. The
	// capsule supplies its own delimiter and its own gap, so strip both and every
	// marker reads the same whatever wrote it.
	function normalizeMarker(reference) {
		const text = [];
		(function collect(node) {
			for (const child of node.childNodes) child.nodeType === Node.TEXT_NODE ? text.push(child) : collect(child);
		})(reference);
		if (text.length === 1) {
			const bare = text[0].data.trim().match(/^[[(]\s*(.+?)\s*[\])]$/);
			if (bare) text[0].data = bare[1];
		}

		// Climb to the outermost box that holds nothing but this marker — hidden
		// tooltips and the landmarks inserted above don't count — then close up the
		// space in front of it, the way a reference mark sits against its word.
		let box = reference;
		while (box.parentElement && box.parentElement !== article &&
			[...box.parentElement.childNodes].every(node => node === box || node.hidden || !node.textContent.trim())) {
			box = box.parentElement;
		}
		let before = box.previousSibling;
		while (before && !before.textContent) before = before.previousSibling;
		if (before?.nodeType !== Node.TEXT_NODE) return;
		before.data = before.data.replace(/\s+$/, "");

		// The capsule is an inline-flex box, and a line may break on either side of
		// one, so a marker could land alone at the start of the next line. Hold it
		// to the word it annotates. A very long "word" (a URL) is left to wrap.
		const word = before.data.match(/\S{1,30}$/);
		if (!word || (word.index > 0 && !/\s/.test(before.data[word.index - 1]))) return;
		const tail = word.index ? before.splitText(word.index) : before;
		const joined = document.createElement("span");
		joined.className = "ember-footnote-joined";
		tail.before(joined);
		for (let node = tail; node; ) {
			const next = node === box ? null : node.nextSibling;
			joined.appendChild(node);
			node = next;
		}
	}

	// A detached copy of the note, with return links to this reference dropped and
	// every id stripped — the copy is appended to the same document, so any id it
	// carried over would collide with the one still on the original note.
	function cleanContent(source, reference) {
		const copy = source.cloneNode(true);
		const referenceIds = new Set([reference.id, reference.closest("sup[id]")?.id].filter(Boolean));
		for (const link of copy.querySelectorAll("a")) {
			if (isBacklink(link) || referenceIds.has(localHashId(link))) link.remove();
		}
		for (const element of copy.querySelectorAll("[id]")) element.removeAttribute("id");
		return copy;
	}

	for (const reference of article.querySelectorAll("a")) {
		if (isBacklink(reference)) continue;
		const note = noteFor(reference);
		if (!note) continue;
		const content = cleanContent(note.content, reference);
		if (!content.children.length && !content.textContent.trim()) continue;

		const innerLandmark = reference.querySelector(innerLandmarkSelector);
		const referenceIds = [
			reference.id,
			reference.closest("sup[id]")?.id,
			innerLandmark?.id
		].filter(Boolean);
		let returnTarget = reference.id ? reference : reference.closest("sup[id]") || innerLandmark;

		// The open Substack patch identifies references by this ID. Move it to a
		// same-position landmark so either patched or stock NetNewsWire uses the
		// normalized target below, while the article's return links still work.
		if (reference.matches("a[id^='footnote-anchor-']")) {
			const landmark = document.createElement("span");
			landmark.id = reference.id;
			landmark.setAttribute("aria-hidden", "true");
			reference.before(landmark);
			reference.removeAttribute("id");
			returnTarget = landmark;
		}
		if (!returnTarget?.id) {
			const landmark = document.createElement("span");
			do {
				landmark.id = `ember-footnote-reference-${++referenceNumber}`;
			} while (document.getElementById(landmark.id));
			landmark.setAttribute("aria-hidden", "true");
			reference.before(landmark);
			returnTarget = landmark;
		}
		for (const id of referenceIds) backlinkDestinations.set(id, returnTarget.id);

		const target = document.createElement("div");
		do {
			target.id = `ember-footnote-${++noteNumber}`;
		} while (document.getElementById(target.id));
		target.append(...content.childNodes);
		normalizedNotes.appendChild(target);
		reference.setAttribute("href", `#${target.id}`);
		reference.classList.add("footnote");
		if (note.hide) note.hide.hidden = true;
		normalizeMarker(reference);
	}

	if (normalizedNotes.hasChildNodes()) article.appendChild(normalizedNotes);

	// Feed authors often emit absolute backlinks to the original web article.
	// Point recognized return links at the corresponding marker in this rendered
	// document and handle the scroll here so NetNewsWire never opens the website.
	for (const backlink of article.querySelectorAll("a[href*='#']")) {
		const destination = backlinkDestinations.get(localHashId(backlink));
		if (!destination || backlink.classList.contains("footnote")) continue;
		backlink.setAttribute("href", `#${destination}`);
		backlink.dataset.emberFootnoteBacklink = "";
	}

	article.addEventListener("click", event => {
		if (!(event.target instanceof Element)) return;
		const backlink = event.target.closest("a[data-ember-footnote-backlink]");
		if (!backlink) return;
		const targetId = localHashId(backlink);
		const target = targetId && document.getElementById(targetId);
		if (!target) return;
		event.preventDefault();
		event.stopPropagation();
		target.scrollIntoView({block: "center"});
		const marker = target.matches("a.footnote") ? target : target.querySelector("a.footnote") || target.closest("a.footnote") || target.nextElementSibling;
		if (marker instanceof HTMLAnchorElement) marker.focus({preventScroll: true});
	});
})();
</script>
