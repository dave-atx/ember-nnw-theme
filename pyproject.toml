[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nnw-theme-tools"
version = "0.1.0"
description = "Authoring tools for the NetNewsWire theme template"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = ["questionary==2.1.1"]

[project.scripts]
nnw-theme = "nnw_theme_tools.cli:main"

[dependency-groups]
dev = ["ruff==0.13.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/nnw_theme_tools"]

[tool.ruff]
target-version = "py314"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]

[tool.nnw-theme.netnewswire]
release = "mac-7.1.3"
commit = "f2daca0f24f29c08d9cb16e1bdc56293fd6fe286"

[[tool.nnw-theme.netnewswire.files]]
destination = "LICENSE"
source = "LICENSE"
sha256 = "712d3c84a79fa1dd7e049341797dd638f9517acfe503bb531fb7f0e18cfa1b43"

[[tool.nnw-theme.netnewswire.files]]
destination = "Mac/main_mac.js"
source = "Mac/MainWindow/Detail/main_mac.js"
sha256 = "3ac1ef46523f6c4d8103fe7dbe6f45486d57a94c3d54d0fcb6211a35215bb676"

[[tool.nnw-theme.netnewswire.files]]
destination = "Mac/page.html"
